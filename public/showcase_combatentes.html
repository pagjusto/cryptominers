<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIPTO MYNERS — Showcase de Combatentes & Armas</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }
    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .title-area h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-area p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .global-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .global-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .nav-bar {
      max-width: 1400px;
      margin: 16px auto;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .nav-btn {
      background: #1e293b;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #334155;
      transition: all 0.15s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 24px;
    }
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.25s;
      scroll-margin-top: 100px;
    }
    .hero-card:target {
      border-color: #f59e0b;
      box-shadow: 0 0 25px var(--accent-glow);
    }
    .card-header {
      padding: 14px 18px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rarity-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .rarity-common { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .rarity-rare { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .rarity-epic { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .rarity-legendary { background: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.4); }
    .rarity-super_legend { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .canvas-container {
      position: relative;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #1f2937;
    }
    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .card-body {
      padding: 16px 18px;
      font-size: 13px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .stat-val {
      color: var(--text);
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .ctrl-btn {
      flex: 1;
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: #374151;
      color: #fff;
    }
    .ctrl-btn.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }
    .copy-link-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
    }
    .copy-link-btn:hover {
      color: #f59e0b;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="title-area">
        <h1>🎖️ CRIPTO MYNERS — SHOWCASE DOS COMBATENTES</h1>
        <p>Verificação individual de movimentação, mira, recuo e efeitos balísticos de cada combatente</p>
      </div>
      <div>
        <a href="/" class="global-btn">🎮 Voltar ao Jogo (Localhost)</a>
      </div>
    </div>
  </header>

  <nav class="nav-bar" id="navbar">
    <!-- Links dinâmicos injetados via JS -->
  </nav>

  <main class="container" id="cards-container">
    <!-- Cards dinâmicos injetados via JS -->
  </main>

  <script type="module">
    // Dados oficiais do HERO_ROSTER e WEAPON_CATALOG
    const HERO_ROSTER = [
      { id: 'verdant', name: 'Verdant', classId: 'explorer', className: 'Explorador', rarity: 'common', rarityName: 'Comum', spriteIndex: 0, weaponId: 'assault-rifle', role: 'Reconhecimento e mobilidade' },
      { id: 'granito', name: 'Granito', classId: 'tank', className: 'Tanque', rarity: 'legendary', rarityName: 'Legend', spriteIndex: 1, weaponId: 'heavy-machine-gun', role: 'Absorção de dano e proteção' },
      { id: 'nox', name: 'Nox', classId: 'fighter', className: 'Combatente', rarity: 'epic', rarityName: 'Épico', spriteIndex: 2, weaponId: 'energy-blaster', role: 'Combate equilibrado' },
      { id: 'brasa', name: 'Brasa', classId: 'assault', className: 'Assalto (Molotov)', rarity: 'legendary', rarityName: 'Legend', spriteIndex: 3, weaponId: 'molotov', role: 'Arremesso de coquetel molotov e poça incendiária em área' },
      { id: 'mumia', name: 'Múmia', classId: 'survivor', className: 'Sobrevivente', rarity: 'common', rarityName: 'Comum', spriteIndex: 5, weaponId: 'shotgun', role: 'Resistência e combate próximo' },
      { id: 'polar', name: 'Polar', classId: 'specialist', className: 'Especialista', rarity: 'rare', rarityName: 'Raro', spriteIndex: 6, weaponId: 'compact-rifle', role: 'Precisão e suporte tático' },
      { id: 'fenix', name: 'Fênix', classId: 'assault', className: 'Assalto (Lança-chamas)', rarity: 'super_legend', rarityName: 'Super Legend', spriteIndex: 7, weaponId: 'flamethrower', role: 'Jato contínuo de chamas e dispersão de calor em área' },
      { id: 'sombra', name: 'Sombra', classId: 'infiltrator', className: 'Infiltrador', rarity: 'rare', rarityName: 'Raro', spriteIndex: 8, weaponId: 'precision-rifle', role: 'Ataque de precisão de longo alcance' },
      { id: 'iron', name: 'Iron', classId: 'heavy', className: 'Granadeiro Blindado', rarity: 'epic', rarityName: 'Épico', spriteIndex: 9, weaponId: 'grenade', role: 'Arremesso de granadas e explosão em área' },
      { id: 'colosso', name: 'Colosso', classId: 'juggernaut', className: 'Tanque de elite', rarity: 'super_legend', rarityName: 'Super Legend', spriteIndex: 10, weaponId: 'rocket-launcher', role: 'Poder de fogo pesado balístico' },
      { id: 'hunter', name: 'Hunter', classId: 'marksman', className: 'Atirador', rarity: 'common', rarityName: 'Comum', spriteIndex: 11, weaponId: 'tactical-carbine', role: 'Tiroteio tático e combate direto' },
      { id: 'scarlet', name: 'Scarlet', classId: 'guerrilla', className: 'Guerrilheira', rarity: 'common', rarityName: 'Comum', spriteIndex: 12, weaponId: 'heavy-pistol', role: 'Ataque rápido e suporte tático' }
    ];

    const WEAPON_CATALOG = {
      'assault-rifle': { name: 'Rifle de Assalto', sourceIndex: 0, category: 'Fuzil Automático' },
      'heavy-machine-gun': { name: 'Metralhadora Pesada', sourceIndex: 8, category: 'Arma Pesada de Suporte' },
      'energy-blaster': { name: 'Canhão de Energia', sourceIndex: 3, category: 'Feixe de Plasma' },
      'flamethrower': { name: 'Lança-chamas Tático', sourceIndex: 2, category: 'Jato Contínuo de Fogo' },
      'medical-kit': { name: 'Injetor de Suporte', sourceIndex: 6, category: 'Dispositivo Tático' },
      'shotgun': { name: 'Escopeta Calibre 12', sourceIndex: 9, category: 'Dispersão de Chumbo' },
      'compact-rifle': { name: 'Rifle Compacto', sourceIndex: 5, category: 'Carbina Leve' },
      'flare-launcher': { name: 'Lançador Incendiário', sourceIndex: 4, category: 'Projéteis Térmicos' },
      'molotov': { name: 'Coquetel Molotov', sourceIndex: 4, category: 'Incendiário Arremessável', scale: 0.65 },
      'precision-rifle': { name: 'Rifle de Precisão (Sniper)', sourceIndex: 8, category: 'Balística de Longo Alcance' },
      'grenade': { name: 'Granada de Fragmentação', sourceIndex: 7, category: 'Explosivo Arremessável', scale: 0.68 },
      'rocket-launcher': { name: 'Lança-foguetes RPG', sourceIndex: 10, category: 'Projétil Autopropelido' },
      'tactical-carbine': { name: 'Carbina Tática M4', sourceIndex: 11, category: 'Cadência Rápida' },
      'heavy-pistol': { name: 'Pistola Pesada .50', sourceIndex: 12, category: 'Pistola de Alto Calibre', scale: 0.58 }
    };

    // Carregamento dos spritesheets oficiais
    const heroImg = new Image();
    heroImg.crossOrigin = 'anonymous';
    heroImg.src = '/assets/hero-roster.png?v=4';

    const heroUpperImg = new Image();
    heroUpperImg.crossOrigin = 'anonymous';
    heroUpperImg.src = '/assets/hero-roster-upper.png?v=4';

    const heroLegLeftImg = new Image();
    heroLegLeftImg.crossOrigin = 'anonymous';
    heroLegLeftImg.src = '/assets/hero-roster-leg-left.png?v=4';

    const heroLegRightImg = new Image();
    heroLegRightImg.crossOrigin = 'anonymous';
    heroLegRightImg.src = '/assets/hero-roster-leg-right.png?v=4';

    const weaponImg = new Image();
    weaponImg.crossOrigin = 'anonymous';
    weaponImg.src = '/assets/weapon-roster.png?v=4';

    const navbar = document.getElementById('navbar');
    const container = document.getElementById('cards-container');

    const cardStates = {};

    HERO_ROSTER.forEach(hero => {
      const weapon = WEAPON_CATALOG[hero.weaponId] || { name: 'Arma Padrão', sourceIndex: hero.spriteIndex, category: 'Arma de Fogo' };
      
      // Link na barra de navegação
      const navItem = document.createElement('a');
      navItem.href = `#${hero.id}`;
      navItem.className = 'nav-btn';
      navItem.textContent = hero.name;
      navbar.appendChild(navItem);

      // Card do herói
      const card = document.createElement('div');
      card.className = 'hero-card';
      card.id = hero.id;

      cardStates[hero.id] = {
        mode: 'shooting', // 'shooting' ou 'walking'
        direction: 1,     // 1 = direita, -1 = esquerda
        targetDist: 34,   // Bem perto: combate corpo a corpo / queima-roupa direto
        particles: [],
        sparks: [],
        explosions: [],
        groundFlames: [],
        shotTimer: 0
      };

      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">
            <span>${hero.name}</span>
            <span class="rarity-pill rarity-${hero.rarity}">${hero.rarityName}</span>
          </div>
          <button class="copy-link-btn" onclick="navigator.clipboard.writeText(window.location.origin + window.location.pathname + '#${hero.id}'); alert('Link copiado: #' + '${hero.id}')">📋 Copiar Link</button>
        </div>
        <div class="canvas-container">
          <canvas id="canvas-${hero.id}" width="420" height="220"></canvas>
        </div>
        <div class="card-body">
          <div class="stat-row">
            <span>Classe / Função:</span>
            <span class="stat-val">${hero.className} (${hero.role})</span>
          </div>
          <div class="stat-row">
            <span>Arma Equipada:</span>
            <span class="stat-val" style="color: #fbbf24">${weapon.name}</span>
          </div>
          <div class="stat-row">
            <span>Tipo Balístico:</span>
            <span class="stat-val">${weapon.category}</span>
          </div>
          <div class="controls">
            <button class="ctrl-btn active" id="btn-mode-${hero.id}" onclick="toggleMode('${hero.id}')">💥 Modo: Disparando</button>
            <button class="ctrl-btn" onclick="toggleDir('${hero.id}')">🔄 Virar Sentido</button>
          </div>
        </div>
      `;

      container.appendChild(card);
    });

    window.toggleMode = function(heroId) {
      const st = cardStates[heroId];
      st.mode = st.mode === 'shooting' ? 'walking' : 'shooting';
      const btn = document.getElementById(`btn-mode-${heroId}`);
      if (st.mode === 'shooting') {
        btn.textContent = '💥 Modo: Disparando';
        btn.classList.add('active');
      } else {
        btn.textContent = '🚶 Modo: Caminhando';
        btn.classList.remove('active');
      }
    };

    window.toggleDir = function(heroId) {
      const st = cardStates[heroId];
      st.direction *= -1;
    };

    // Loop de animação global a 60 FPS
    function animate() {
      const now = performance.now();

      HERO_ROSTER.forEach(hero => {
        const cvs = document.getElementById(`canvas-${hero.id}`);
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const st = cardStates[hero.id];
        const weapon = WEAPON_CATALOG[hero.weaponId] || { sourceIndex: hero.spriteIndex };

        ctx.clearRect(0, 0, cvs.width, cvs.height);

        // Grade de piso tático suave
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        for (let x = 0; x < cvs.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, cvs.height);
          ctx.stroke();
        }
        for (let y = 0; y < cvs.height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(cvs.width, y);
          ctx.stroke();
        }

        const hX = cvs.width / 2 - (st.direction > 0 ? 35 : -35);
        const hY = 150; // Linha de solo sólida para herói e zumbi

        // Alvo zumbi simulado à frente bem perto (distância de contato direto: 34px)
        const targetX = hX + st.direction * 34;
        const targetY = hY;

        ctx.save();
        // Sombra do alvo zumbi fixada rigorosamente no chão
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(targetX, targetY, 16, 4.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Alvo estilizado (Silhueta de zumbi de treino) apoiado no chão
        ctx.fillStyle = '#4d7c0f';
        ctx.beginPath();
        ctx.arc(targetX, targetY - 37, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(targetX - 7, targetY - 29, 14, 20);
        ctx.fillStyle = '#1e3a1e';
        ctx.fillRect(targetX - 6, targetY - 9, 5, 9);
        ctx.fillRect(targetX + 1, targetY - 9, 5, 9);

        // Placa de alvo no peito
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(targetX, targetY - 19, 13, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Renderização do Herói
        ctx.save();
        ctx.translate(hX, hY);
        if (st.direction < 0) {
          ctx.scale(-1, 1);
        }

        // Sombra de contato do herói exatamente sob a sola das botas (sem flutuar)
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 18, 5.0, 0, 0, Math.PI * 2);
        ctx.fill();

        const isShooting = st.mode === 'shooting';
        const cadence = 650; // ms por ciclo de tiro
        const cycleProgress = (now % cadence) / cadence;

        const pw = 55; // Escala calibrada aumentada suavemente (~15%)
        const ph = 62;
        const wScale = weapon.scale || 1.0;
        const gw = 45 * wScale;
        const gh = 25 * wScale;

        const sw = 128;
        const sh = 128;
        const sx = hero.spriteIndex * sw;
        const sy = 0;

        const wsw = 256;
        const wsh = 144;
        const wsx = weapon.sourceIndex * wsw;
        const wsy = 0;

        const dx = -pw / 2;
        // dy calibrado para que a sola da bota (y=100 no sprite 128px) toque exatamente y=0 no solo
        const dy = -(100 / 128) * ph;

        const hipLeftX = dx + pw * (56 / 128);
        const hipLeftY = dy + ph * (72 / 128);
        const hipRightX = dx + pw * (72 / 128);
        const hipRightY = dy + ph * (72 / 128);

        // Ponto anatômico exato da mão direita do herói onde a empunhadura da arma se fixa
        const handX = dx + pw * (86 / 128);
        const handY = dy + ph * (69 / 128);

        // Ponto da empunhadura (grip) calibrado dentro da arma
        const wGripX = gw * (100 / 256);
        const wGripY = gh * (74 / 144);

        if (!isShooting) {
          // MODO CAMINHADA
          const stepPhase = now * 0.015;
          const legSwing = Math.sin(stepPhase) * 0.42;
          const stepBob = Math.abs(Math.sin(stepPhase)) * 2.2;
          const torsoSway = Math.sin(stepPhase) * 0.035;

          // Perna direita
          ctx.save();
          ctx.translate(hipRightX, hipRightY);
          ctx.rotate(-legSwing);
          ctx.translate(-hipRightX, -hipRightY);
          if (heroLegRightImg.complete) ctx.drawImage(heroLegRightImg, sx, sy, sw, sh, dx, dy, pw, ph);
          ctx.restore();

          // Perna esquerda
          ctx.save();
          ctx.translate(hipLeftX, hipLeftY);
          ctx.rotate(legSwing);
          ctx.translate(-hipLeftX, -hipLeftY);
          if (heroLegLeftImg.complete) ctx.drawImage(heroLegLeftImg, sx, sy, sw, sh, dx, dy, pw, ph);
          ctx.restore();

          // Tronco
          ctx.save();
          ctx.translate(0, -stepBob);
          ctx.rotate(torsoSway);
          if (heroUpperImg.complete) ctx.drawImage(heroUpperImg, sx, sy, sw, sh, dx, dy, pw, ph);

          // Arma em descanso na mão do herói
          if (weaponImg.complete) {
            ctx.save();
            ctx.translate(handX - 2, handY + 1);
            ctx.rotate(0.35 + Math.sin(stepPhase) * 0.05);
            ctx.drawImage(weaponImg, wsx, wsy, wsw, wsh, -wGripX, -wGripY, gw, gh);

            // Mão segurando a empunhadura
            ctx.fillStyle = '#fed7aa';
            ctx.strokeStyle = '#18181b';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
          }
          ctx.restore(); // Fecha tronco
        } else {
          // MODO DISPARO / BALÍSTICA (COM LEVE BALANÇO PARA TRÁS, SEM CORTAR O PERSONAGEM AO MEIO)
          let bodyRock = 0;   // Ângulo de balanço suave do corpo (radianos)
          let bodyShift = 0;  // Recuo linear suave (pixels)
          let gunPitch = 0;   // Coice do cano para cima
          let isFiringMoment = false;

          if (cycleProgress < 0.20) {
            // 1. Postura firme de mira horizontal
            const p = cycleProgress / 0.20;
            bodyRock = 0.02 * p;
            gunPitch = 0.06 - p * 0.06;
          } else if (cycleProgress < 0.45) {
            // 2. Detonação e recuo: leve balanço para trás do personagem como um todo
            const p = (cycleProgress - 0.20) / 0.25;
            const kick = Math.sin(p * Math.PI);
            bodyRock = 0.02 - kick * 0.07; // Leve balanço para trás (~4 graus)
            bodyShift = -kick * 2.5;       // Recuo suave de 2.5px
            gunPitch = -kick * 0.22;       // Elevação leve do cano
            if (p < 0.4) isFiringMoment = true;
          } else if (cycleProgress < 0.75) {
            // 3. Retorno suave e absorção do recuo
            const p = (cycleProgress - 0.45) / 0.30;
            bodyRock = -0.05 * (1 - p);
            bodyShift = -2.5 * (1 - p);
            gunPitch = -0.10 * (1 - p);
          } else {
            // 4. Pronto para o próximo disparo
            bodyRock = 0;
            bodyShift = 0;
            gunPitch = 0;
          }

          // Renderiza o combatente UNIFICADO (pernas e tronco juntos sem cortar no meio!)
          ctx.save();
          ctx.translate(bodyShift, 0);
          ctx.rotate(bodyRock);

          if (heroLegRightImg.complete) ctx.drawImage(heroLegRightImg, sx, sy, sw, sh, dx, dy, pw, ph);
          if (heroLegLeftImg.complete) ctx.drawImage(heroLegLeftImg, sx, sy, sw, sh, dx, dy, pw, ph);
          if (heroUpperImg.complete) ctx.drawImage(heroUpperImg, sx, sy, sw, sh, dx, dy, pw, ph);

          // Arma apontada e empunhada diretamente na mão do herói (sem flutuar)
          ctx.save();
          ctx.translate(handX, handY);
          ctx.rotate(gunPitch);
          if (weaponImg.complete) {
            ctx.drawImage(weaponImg, wsx, wsy, wsw, wsh, -wGripX, -wGripY, gw, gh);

            // Mão segurando a empunhadura firmemente
            ctx.fillStyle = '#fed7aa';
            ctx.strokeStyle = '#18181b';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(0, 0, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }

          // Disparo balístico, arremesso de granada, molotov ou jato de chamas
          if (isFiringMoment) {
            const wid = hero.weaponId;
            const muzzleTipX = gw - wGripX;

            if (wid === 'grenade') {
              // GRANADEIRO (Iron): Arremessa granada pesada em arco parabólico
              if (st.shotTimer < now - 620) {
                st.shotTimer = now;
                st.particles.push({
                  type: 'grenade',
                  startX: hX + st.direction * handX,
                  startY: hY + handY,
                  targetX: targetX,
                  targetY: targetY - 6,
                  progress: 0,
                  speed: 0.048,
                  rotation: 0
                });
              }
            } else if (wid === 'molotov') {
              // LANÇADOR DE MOLOTOV (Brasa): Arremessa coquetel molotov em chamas
              if (st.shotTimer < now - 650) {
                st.shotTimer = now;
                st.particles.push({
                  type: 'molotov',
                  startX: hX + st.direction * handX,
                  startY: hY + handY,
                  targetX: targetX,
                  targetY: targetY + 8,
                  progress: 0,
                  speed: 0.042,
                  rotation: 0
                });
              }
            } else if (wid === 'flamethrower') {
              // LANÇA-CHAMAS (Fênix): Cospe jato contínuo de labaredas
              if (st.shotTimer < now - 50) {
                st.shotTimer = now;
                for (let f = 0; f < 3; f++) {
                  st.particles.push({
                    type: 'flame',
                    x: hX + st.direction * (handX + muzzleTipX),
                    y: hY + handY + (Math.random() - 0.5) * 3,
                    vx: st.direction * (4.2 + Math.random() * 3.8),
                    vy: (Math.random() - 0.5) * 1.8 - 0.3,
                    size: 3.5,
                    maxSize: 15 + Math.random() * 6,
                    life: 1.0,
                    decay: 0.045 + Math.random() * 0.02
                  });
                }
              }
              // Chama piloto na ponta do cano
              ctx.save();
              ctx.translate(muzzleTipX, -1);
              ctx.fillStyle = '#fef08a';
              ctx.beginPath();
              ctx.arc(0, 0, 4, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            } else if (wid === 'rocket-launcher') {
              // LANÇA-FOGUETES (Colosso): Dispara míssil RPG
              if (st.shotTimer < now - 680) {
                st.shotTimer = now;
                st.particles.push({
                  type: 'rocket',
                  x: hX + st.direction * (handX + muzzleTipX),
                  y: hY + handY - 1,
                  vx: st.direction * 11,
                  vy: 0,
                  life: 1.0
                });
              }
            } else {
              // ARMAS DE FOGO PADRÃO: Muzzle Flash e Projéteis Balísticos
              ctx.save();
              ctx.translate(muzzleTipX, -1);
              ctx.fillStyle = wid === 'energy-blaster' ? '#38bdf8' : '#fef08a';
              ctx.beginPath();
              ctx.arc(0, 0, 6, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = wid === 'energy-blaster' ? '#0284c7' : '#f97316';
              ctx.beginPath();
              ctx.moveTo(0, -5);
              ctx.lineTo(14, 0);
              ctx.lineTo(0, 5);
              ctx.closePath();
              ctx.fill();
              ctx.restore();

              const cadence = wid === 'shotgun' ? 550 : (wid === 'heavy-machine-gun' ? 220 : 380);
              if (st.shotTimer < now - cadence) {
                st.shotTimer = now;
                const count = wid === 'shotgun' ? 3 : 1;
                for (let k = 0; k < count; k++) {
                  st.particles.push({
                    type: wid === 'energy-blaster' ? 'plasma' : 'bullet',
                    x: hX + st.direction * (handX + muzzleTipX),
                    y: hY + handY + (k - 1) * 2,
                    vx: st.direction * (wid === 'shotgun' ? 12 + Math.random() * 3 : 16),
                    vy: (Math.random() - 0.5) * (wid === 'shotgun' ? 2.5 : 0.8),
                    life: 1.0
                  });
                }
              }
            }
          }

          ctx.restore(); // Fecha arma
          ctx.restore(); // Fecha corpo unificado
        }

        ctx.restore(); // Fecha herói

        // =========================================================================
        // ATUALIZAÇÃO E RENDERIZAÇÃO DE PROJÉTEIS (GRANADAS, MOLOTOVS, CHAMAS, BALAS)
        // =========================================================================
        for (let i = st.particles.length - 1; i >= 0; i--) {
          const pt = st.particles[i];

          if (pt.type === 'grenade') {
            // Granada voando em parábola realista
            pt.progress += pt.speed;
            const arc = Math.sin(pt.progress * Math.PI) * 28;
            pt.x = pt.startX + (pt.targetX - pt.startX) * pt.progress;
            pt.y = pt.startY + (pt.targetY - pt.startY) * pt.progress - arc;
            pt.rotation += 0.35 * st.direction;

            ctx.save();
            ctx.translate(pt.x, pt.y);
            ctx.rotate(pt.rotation);
            // Corpo oval da granada
            ctx.fillStyle = '#3f6212';
            ctx.strokeStyle = '#14532d';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(0, 0, 4.5, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Espoleta prateada
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(-1.5, -8, 3, 3);
            ctx.restore();

            // Rastro de fumaça leve
            if (Math.random() > 0.4) {
              st.sparks.push({
                x: pt.x,
                y: pt.y,
                vx: (Math.random() - 0.5) * 1.0,
                vy: -Math.random() * 1.5,
                color: 'rgba(203, 213, 225, 0.4)',
                size: 2.5,
                life: 0.4
              });
            }

            // DETONAÇÃO E EXPLOSÃO NO ZUMBI
            if (pt.progress >= 1.0) {
              st.particles.splice(i, 1);
              // Onda de choque e bola de fogo esférica
              st.explosions.push({
                x: targetX,
                y: targetY - 10,
                radius: 4,
                maxRadius: 30,
                life: 1.0
              });
              // 18 estilhaços e fragmentos incandescentes
              for (let s = 0; s < 18; s++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 3 + Math.random() * 6.5;
                st.sparks.push({
                  x: targetX,
                  y: targetY - 10,
                  vx: Math.cos(ang) * spd,
                  vy: Math.sin(ang) * spd - 2,
                  color: Math.random() > 0.4 ? '#fbbf24' : (Math.random() > 0.5 ? '#f97316' : '#ef4444'),
                  size: 2 + Math.random() * 2.5,
                  life: 1.0
                });
              }
            }
          } else if (pt.type === 'molotov') {
            // Molotov com garrafa de vidro e pano em chamas em parábola
            pt.progress += pt.speed;
            const arc = Math.sin(pt.progress * Math.PI) * 26;
            pt.x = pt.startX + (pt.targetX - pt.startX) * pt.progress;
            pt.y = pt.startY + (pt.targetY - pt.startY) * pt.progress - arc;
            pt.rotation += 0.30 * st.direction;

            ctx.save();
            ctx.translate(pt.x, pt.y);
            ctx.rotate(pt.rotation);
            // Garrafa de vidro âmbar
            ctx.fillStyle = '#78350f';
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1;
            ctx.fillRect(-3, -4, 6, 9);
            ctx.fillRect(-1.5, -8, 3, 4);
            // Pano aceso na ponta
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(0, -9, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(0, -11, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Faíscas no ar
            if (Math.random() > 0.4) {
              st.sparks.push({
                x: pt.x,
                y: pt.y - 4,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                color: '#f97316',
                size: 2,
                life: 0.5
              });
            }

            // ESTILHAÇAMENTO E LABAREDAS NO ALVO
            if (pt.progress >= 1.0) {
              st.particles.splice(i, 1);
              // Cacos de vidro
              for (let s = 0; s < 12; s++) {
                const ang = Math.random() * Math.PI * 2;
                st.sparks.push({
                  x: targetX,
                  y: targetY + 6,
                  vx: Math.cos(ang) * (2 + Math.random() * 4),
                  vy: Math.sin(ang) * (2 + Math.random() * 4) - 2.5,
                  color: Math.random() > 0.5 ? '#b45309' : '#fef3c7',
                  size: 2,
                  life: 0.7
                });
              }
              // Poça e labaredas de fogo consumidor no zumbi e chão
              for (let f = 0; f < 8; f++) {
                st.groundFlames.push({
                  x: targetX + (Math.random() - 0.5) * 22,
                  y: targetY + 10 + (Math.random() - 0.5) * 4,
                  height: 14 + Math.random() * 16,
                  life: 1.4,
                  decay: 0.016
                });
              }
            }
          } else if (pt.type === 'flame') {
            // Labareda de lança-chamas em expansão contínua
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.size += (pt.maxSize - pt.size) * 0.12;
            pt.life -= pt.decay;

            if (pt.life <= 0) {
              st.particles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0, pt.life);
            const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.size);
            grad.addColorStop(0, '#fef08a');
            grad.addColorStop(0.35, '#f97316');
            grad.addColorStop(0.75, '#dc2626');
            grad.addColorStop(1, 'rgba(69, 10, 10, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Ao tocar no zumbi, ateia fogo contínuo
            if ((st.direction > 0 && pt.x >= targetX) || (st.direction < 0 && pt.x <= targetX)) {
              if (Math.random() > 0.55) {
                st.groundFlames.push({
                  x: targetX + (Math.random() - 0.5) * 14,
                  y: targetY + 6 + (Math.random() - 0.5) * 6,
                  height: 9 + Math.random() * 13,
                  life: 0.85,
                  decay: 0.038
                });
              }
            }
          } else if (pt.type === 'rocket') {
            // Projétil de foguete RPG
            pt.x += pt.vx;
            ctx.save();
            ctx.fillStyle = '#475569';
            ctx.fillRect(pt.x - 6, pt.y - 2.5, 12, 5);
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.moveTo(pt.x + 6 * st.direction, pt.y - 3);
            ctx.lineTo(pt.x + 10 * st.direction, pt.y);
            ctx.lineTo(pt.x + 6 * st.direction, pt.y + 3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            if ((st.direction > 0 && pt.x >= targetX) || (st.direction < 0 && pt.x <= targetX)) {
              st.particles.splice(i, 1);
              st.explosions.push({
                x: targetX,
                y: targetY - 8,
                radius: 5,
                maxRadius: 32,
                life: 1.0
              });
              for (let s = 0; s < 14; s++) {
                const ang = Math.random() * Math.PI * 2;
                st.sparks.push({
                  x: targetX,
                  y: targetY - 8,
                  vx: Math.cos(ang) * (3 + Math.random() * 5),
                  vy: Math.sin(ang) * (3 + Math.random() * 5) - 2,
                  color: '#f97316',
                  size: 2.5,
                  life: 1.0
                });
              }
            }
          } else if (pt.type === 'plasma') {
            // Disparo de plasma azul elétrico
            pt.x += pt.vx;
            pt.y += pt.vy;
            ctx.save();
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if ((st.direction > 0 && pt.x >= targetX) || (st.direction < 0 && pt.x <= targetX)) {
              st.particles.splice(i, 1);
              for (let s = 0; s < 8; s++) {
                st.sparks.push({
                  x: targetX,
                  y: targetY - 8,
                  vx: (Math.random() - 0.5) * 7,
                  vy: (Math.random() - 0.5) * 7 - 2,
                  color: '#38bdf8',
                  size: 2.5,
                  life: 0.8
                });
              }
            }
          } else {
            // Projétil balístico convencional (Rifles, Metralhadora, Escopeta, Pistolas)
            pt.x += pt.vx;
            pt.y += pt.vy;

            ctx.save();
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(pt.x - pt.vx * 1.6, pt.y);
            ctx.lineTo(pt.x, pt.y);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if ((st.direction > 0 && pt.x >= targetX) || (st.direction < 0 && pt.x <= targetX)) {
              st.particles.splice(i, 1);
              for (let s = 0; s < 8; s++) {
                st.sparks.push({
                  x: targetX,
                  y: targetY - 8,
                  vx: (Math.random() - 0.5) * 6,
                  vy: (Math.random() - 0.5) * 6 - 2,
                  color: Math.random() > 0.5 ? '#f97316' : '#facc15',
                  size: 2,
                  life: 1.0
                });
              }
            }
          }
        }

        // =========================================================================
        // RENDERIZAÇÃO DE EXPLOSÕES (GRANADAS E FOGUETES)
        // =========================================================================
        for (let i = st.explosions.length - 1; i >= 0; i--) {
          const exp = st.explosions[i];
          exp.radius += (exp.maxRadius - exp.radius) * 0.20;
          exp.life -= 0.045;
          if (exp.life <= 0) {
            st.explosions.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, exp.life);
          // Onda de choque branca
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5 * exp.life;
          ctx.beginPath();
          ctx.arc(exp.x, exp.y, exp.radius * 1.25, 0, Math.PI * 2);
          ctx.stroke();

          // Bola de fogo explosiva
          const grad = ctx.createRadialGradient(exp.x, exp.y, 0, exp.x, exp.y, exp.radius);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.2, '#fef08a');
          grad.addColorStop(0.55, '#f97316');
          grad.addColorStop(0.85, '#dc2626');
          grad.addColorStop(1, 'rgba(69, 10, 10, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // =========================================================================
        // RENDERIZAÇÃO DE LABAREDAS NO CHÃO / ZUMBI (MOLOTOV E LANÇA-CHAMAS)
        // =========================================================================
        for (let i = st.groundFlames.length - 1; i >= 0; i--) {
          const fl = st.groundFlames[i];
          fl.life -= fl.decay;
          if (fl.life <= 0) {
            st.groundFlames.splice(i, 1);
            continue;
          }
          const h = fl.height * Math.min(1, fl.life);
          const wobble = Math.sin(now * 0.025 + fl.x) * 3;
          ctx.save();
          ctx.globalAlpha = Math.min(1, fl.life);
          const grad = ctx.createLinearGradient(fl.x, fl.y, fl.x, fl.y - h);
          grad.addColorStop(0, '#fef08a');
          grad.addColorStop(0.35, '#f97316');
          grad.addColorStop(0.75, '#dc2626');
          grad.addColorStop(1, 'rgba(185, 28, 28, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(fl.x - 4, fl.y);
          ctx.quadraticCurveTo(fl.x + wobble, fl.y - h * 0.6, fl.x, fl.y - h);
          ctx.quadraticCurveTo(fl.x - wobble, fl.y - h * 0.6, fl.x + 4, fl.y);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // =========================================================================
        // FAÍSCAS, BRASAS E ESTILHAÇOS DE IMPACTO
        // =========================================================================
        for (let i = st.sparks.length - 1; i >= 0; i--) {
          const spk = st.sparks[i];
          spk.x += spk.vx;
          spk.y += spk.vy;
          spk.life -= 0.045;
          if (spk.life <= 0) {
            st.sparks.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.fillStyle = spk.color;
          ctx.globalAlpha = Math.max(0, spk.life);
          ctx.beginPath();
          ctx.arc(spk.x, spk.y, spk.size || 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

      });

      requestAnimationFrame(animate);
    }

    // Inicia a animação quando os sprites carregarem
    heroImg.onload = () => {
      animate();
    };
    if (heroImg.complete) {
      animate();
    }
  </script>
</body>
</html>
