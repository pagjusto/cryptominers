<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Preview da Animação do Bárbaro Viking 3D</title>
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 24px;
      margin: 0;
      text-align: center;
    }
    h1 { color: #f97316; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-top: 0; }
    .canvas-container {
      display: inline-block;
      margin: 16px auto;
      border: 2px solid #f97316;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(249, 115, 22, 0.25);
      background: #17110c;
    }
    canvas {
      display: block;
    }
    .strip-container {
      margin-top: 24px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>🪓 Teste de Movimento: Bárbaro Viking 3D</h1>
  <p>Visualização em tempo real da física de caminhada, antecipação, golpe de machado e faíscas de impacto.</p>

  <div class="canvas-container">
    <canvas id="liveCanvas" width="480" height="360"></canvas>
  </div>

  <h2>🎞️ Quadro a Quadro do Movimento de Ataque</h2>
  <div class="strip-container">
    <canvas id="stripCanvas" width="1200" height="240"></canvas>
  </div>

  <script type="module">
    import { drawViking, initVikingCutout } from '/src/utils/characterRenderers.js';

    initVikingCutout();

    const liveCanvas = document.getElementById('liveCanvas');
    const liveCtx = liveCanvas.getContext('2d');

    const stripCanvas = document.getElementById('stripCanvas');
    const stripCtx = stripCanvas.getContext('2d');

    let startTime = performance.now();

    function renderLive(now) {
      const elapsed = (now - startTime) * 0.001;
      liveCtx.clearRect(0, 0, liveCanvas.width, liveCanvas.height);

      // Fundo Caverna
      const bg = liveCtx.createRadialGradient(240, 180, 20, 240, 180, 260);
      bg.addColorStop(0, '#2d1b11');
      bg.addColorStop(1, '#0c0704');
      liveCtx.fillStyle = bg;
      liveCtx.fillRect(0, 0, liveCanvas.width, liveCanvas.height);

      // Chão rochoso
      liveCtx.fillStyle = '#1c110b';
      liveCtx.beginPath();
      liveCtx.ellipse(240, 280, 160, 45, 0, 0, Math.PI * 2);
      liveCtx.fill();

      // Ciclo: 1.4s caminhando/respirando -> 1.3s golpe com o machado -> repete
      const cycleTime = elapsed % 2.7;
      let isMining = false;
      let swingProgress = 0;

      if (cycleTime > 1.3) {
        isMining = true;
        swingProgress = Math.min(1, (cycleTime - 1.3) / 1.3);
      }

      // Tremor da rocha e efeito no momento exato do impacto (0.54..0.68)
      const isImpact = isMining && swingProgress >= 0.54 && swingProgress <= 0.68;
      let rockShakeX = 0;
      let rockShakeY = 0;
      if (isImpact) {
        rockShakeX = (Math.random() - 0.5) * 5;
        rockShakeY = (Math.random() - 0.5) * 4;
      }

      // Bloco de Rocha sendo minerado à direita (recebendo o golpe do machado)
      liveCtx.save();
      liveCtx.translate(rockShakeX, rockShakeY);

      // Brilho do bloco sob impacto
      if (isImpact) {
        liveCtx.shadowColor = '#f97316';
        liveCtx.shadowBlur = 20;
      }

      liveCtx.fillStyle = isImpact ? '#d97706' : '#c27f42';
      liveCtx.beginPath();
      liveCtx.roundRect(308, 200, 72, 72, 12);
      liveCtx.fill();
      liveCtx.strokeStyle = isImpact ? '#fef08a' : '#8c5225';
      liveCtx.lineWidth = isImpact ? 4 : 3;
      liveCtx.stroke();
      liveCtx.shadowBlur = 0;

      // Veios dourados
      liveCtx.fillStyle = '#fbbf24';
      liveCtx.fillRect(322, 215, 20, 8);
      liveCtx.fillRect(344, 235, 24, 10);
      liveCtx.fillRect(328, 250, 16, 6);

      // Rachaduras visuais no impacto
      if (isImpact) {
        liveCtx.strokeStyle = '#fef08a';
        liveCtx.lineWidth = 2.5;
        liveCtx.beginPath();
        liveCtx.moveTo(308, 236);
        liveCtx.lineTo(326, 232);
        liveCtx.lineTo(340, 242);
        liveCtx.stroke();
      }

      liveCtx.restore();

      // Desenha o Viking no centro
      liveCtx.save();
      liveCtx.translate(220, 250);
      liveCtx.scale(1.8, 1.8);

      // Aura e Sombra
      const lightGrad = liveCtx.createRadialGradient(0, 8, 4, 0, 8, 45);
      lightGrad.addColorStop(0, 'rgba(249, 115, 22, 0.45)');
      lightGrad.addColorStop(0.5, 'rgba(180, 83, 9, 0.2)');
      lightGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      liveCtx.fillStyle = lightGrad;
      liveCtx.beginPath();
      liveCtx.arc(0, 8, 45, 0, Math.PI * 2);
      liveCtx.fill();

      liveCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      liveCtx.beginPath();
      liveCtx.ellipse(0, 18, 17, 6, 0, 0, Math.PI * 2);
      liveCtx.fill();

      // Executa o golpe real com o machado
      drawViking(liveCtx, now, 0, 0, swingProgress, isMining);
      liveCtx.restore();

      // Texto flutuante de dano no impacto
      if (isImpact) {
        liveCtx.save();
        liveCtx.fillStyle = '#fbbf24';
        liveCtx.font = '900 16px "Segoe UI", sans-serif';
        liveCtx.shadowColor = '#000000';
        liveCtx.shadowBlur = 6;
        liveCtx.textAlign = 'center';
        liveCtx.fillText('💥 CRÍTICO! -14', 344, 182);
        liveCtx.restore();
      }

      // Texto de status do movimento
      liveCtx.fillStyle = isImpact ? '#fbbf24' : '#f97316';
      liveCtx.font = 'bold 15px "Segoe UI", sans-serif';
      liveCtx.textAlign = 'center';
      let statusText = 'CAMINHADA & RESPIRAÇÃO DINÂMICA';
      if (isMining) {
        if (swingProgress < 0.35) {
          statusText = `1. ANTECIPAÇÃO (ERGUENDO O MACHADO): ${(swingProgress / 0.35 * 100).toFixed(0)}%`;
        } else if (swingProgress <= 0.64) {
          statusText = isImpact ? '💥 IMPACTO DIRETO DO MACHADO NA ROCHA!' : '2. DESCIDA ACELERADA DO GOLPE!';
        } else {
          statusText = '3. RECUPERAÇÃO & RECUO';
        }
      }
      liveCtx.fillText(statusText, 240, 40);

      requestAnimationFrame(renderLive);
    }

    function renderStrip() {
      stripCtx.fillStyle = '#0f172a';
      stripCtx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);

      const frames = [
        { label: '1. Repouso (Idle 3D)', mining: false, progress: 0 },
        { label: '2. Caminhada (Passo 3D)', mining: false, progress: 0, nowOffset: 300 },
        { label: '3. Antecipação (Erguer)', mining: true, progress: 0.28 },
        { label: '4. Descida Violenta', mining: true, progress: 0.48 },
        { label: '5. IMPACTO REAL NA ROCHA', mining: true, progress: 0.58 },
        { label: '6. Recuo & Recuperação', mining: true, progress: 0.82 }
      ];

      const colW = stripCanvas.width / frames.length;

      frames.forEach((f, idx) => {
        const cx = idx * colW + colW / 2;
        const cy = 160;

        // Moldura
        stripCtx.strokeStyle = f.label.includes('IMPACTO') ? '#f59e0b' : '#1e293b';
        stripCtx.lineWidth = f.label.includes('IMPACTO') ? 2 : 1;
        stripCtx.strokeRect(idx * colW + 4, 8, colW - 8, stripCanvas.height - 16);

        // Bloco de Rocha nos frames de mineração (à direita do herói)
        if (f.mining) {
          stripCtx.save();
          const rockX = cx + 45;
          const rockY = cy - 25;
          const isImp = f.progress >= 0.54 && f.progress <= 0.65;
          stripCtx.fillStyle = isImp ? '#d97706' : '#c27f42';
          stripCtx.beginPath();
          stripCtx.roundRect(rockX, rockY, 32, 32, 6);
          stripCtx.fill();
          stripCtx.strokeStyle = isImp ? '#fef08a' : '#8c5225';
          stripCtx.lineWidth = isImp ? 2 : 1.5;
          stripCtx.stroke();
          // Veio
          stripCtx.fillStyle = '#fbbf24';
          stripCtx.fillRect(rockX + 6, rockY + 8, 8, 4);
          stripCtx.restore();
        }

        stripCtx.save();
        stripCtx.translate(cx, cy);
        stripCtx.scale(1.2, 1.2);

        // Sombra
        stripCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        stripCtx.beginPath();
        stripCtx.ellipse(0, 18, 17, 6, 0, 0, Math.PI * 2);
        stripCtx.fill();

        drawViking(stripCtx, 1000 + (f.nowOffset || 0), 0, 0, f.progress, f.mining);
        stripCtx.restore();

        // Label
        stripCtx.fillStyle = f.mining ? (f.label.includes('IMPACTO') ? '#fbbf24' : '#f97316') : '#38bdf8';
        stripCtx.font = 'bold 12px "Segoe UI", sans-serif';
        stripCtx.textAlign = 'center';
        stripCtx.fillText(f.label, cx, 30);
      });
    }

    setTimeout(renderStrip, 200);
    setTimeout(renderStrip, 800);
    requestAnimationFrame(renderLive);
  </script>
</body>
</html>
